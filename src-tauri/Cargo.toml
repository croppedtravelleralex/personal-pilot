[package]
name = "personal-pilot-tauri"
version = "1.1.0"
description = "personal-pilot Tauri shell"
authors = ["personal-pilot"]
edition = "2021"

[lib]
name = "personal_pilot_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
